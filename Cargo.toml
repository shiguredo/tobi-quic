[workspace]
resolver = "3"
members = ["tobi-core", "tobi-crypto", "tobi-http3", "tobi-platform", "tobi-qlog", "tobi-quic", "tobi-rustls", "tobi-transport", "tobi-webtransport"]

[workspace.package]
version = "2026.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
# 内部クレート (path で解決する)

# QUIC の基本型 (Frame, VarInt, ConnectionId, TransportParameters など)
tobi_core = { path = "tobi-core", version = "2026.0.0" }
# AEAD / HKDF など aws-lc-rs を使った QUIC 向け暗号プリミティブ
tobi_crypto = { path = "tobi-crypto", version = "2026.0.0" }
# QUIC のストリームと Sans I/O HTTP/3 実装の結線
tobi_http3 = { path = "tobi-http3", version = "2026.0.0" }
# tokio ベースの UDP I/O ドライバ (GSO/GRO は設定で有効化できる)
tobi_platform = { path = "tobi-platform", version = "2026.0.0" }
# qlog (draft-ietf-quic-qlog-*) イベントの型定義と JSON シリアライズ
tobi_qlog = { path = "tobi-qlog", version = "2026.0.0" }
# 公開 API (Connection / Stream / Config など) のトップレベル crate
tobi_quic = { path = "tobi-quic", version = "2026.0.0" }
# rustls::quic API をラップした TLS glue
tobi_rustls = { path = "tobi-rustls", version = "2026.0.0" }
# Sans I/O の QUIC transport state machine
tobi_transport = { path = "tobi-transport", version = "2026.0.0" }
# tobi-http3 を使った WebTransport over HTTP/3 のクライアント側結線
tobi_webtransport = { path = "tobi-webtransport", version = "2026.0.0" }

# 外部クレート (tobi_* クレート間で共通に使うもの)

# AEAD / HKDF / digest など QUIC に必要な暗号プリミティブを提供する
aws-lc-rs = "1.19"
# qlog イベントを JSON / JSON-SEQ で書き出すための依存ゼロ JSON ライブラリ (no_std 利用のため default off)
nojson = { version = "0.3", default-features = false }
# TLS 1.3 実装 (QUIC のハンドシェイク鍵導出に使用)、aws-lc-rs をプロバイダとして使う
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
# WebTransport と interop の HTTP/3 エンドポイントに共通する Sans I/O 実装
shiguredo_http3 = "2026.1.0-canary.14"
# 非同期ランタイム (I/O ドライバとタスク管理)
tokio = "1.54"
# 構造化ロギング、RFC 準拠を確認する際のデバッグにも利用する
tracing = { version = "0.1", default-features = false }
# 鍵などの機密情報を drop 時にゼロ化する
zeroize = "1.9"
